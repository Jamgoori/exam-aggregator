# 도메인(gongmoa.kr) 연결 상태를 밖에서 실제로 찔러보는 점검이다.
# DNS·Vercel·인증서 설정은 저장소 밖에서 하는 일이라 코드로 강제할 수 없다 —
# 대신 "지금 제대로 붙었는지"를 GitHub 웹(폰 브라우저 포함)에서 한 번에 확인한다.
#
# Actions → "도메인 점검" → Run workflow.
name: 도메인 점검

on:
  workflow_dispatch:
  # DNS 전파·인증서 만료·설정 되돌아감을 조용히 놓치지 않도록 주 1회도 돈다.
  schedule:
    - cron: "0 21 * * 0" # 매주 월요일 06:00 KST

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 점검
        env:
          # 해외 IP 차단(GEO_BLOCK)을 켜면 이 점검은 GitHub 러너(미국 IP)에서 도는
          # 탓에 전부 403 이 된다. 저장소 Secrets 에 GEO_BYPASS_TOKEN 을 넣어 두면
          # (Vercel 환경변수 GEO_BLOCK_BYPASS_TOKEN 과 같은 값) 통과한다.
          # 차단을 안 켰다면 비워 둬도 그대로 동작한다.
          GEO_BYPASS_TOKEN: ${{ secrets.GEO_BYPASS_TOKEN }}
        run: |
          APEX=https://gongmoa.kr
          fail=0
          out=""

          # 우회 헤더. 토큰이 없으면 빈 배열이라 curl 에 아무것도 안 붙는다.
          hdr=()
          if [ -n "$GEO_BYPASS_TOKEN" ]; then
            hdr=(-H "x-geo-bypass: $GEO_BYPASS_TOKEN")
          fi

          note() { out="${out}$1"$'\n'; }
          ok()   { note "- ✅ $1"; }
          bad()  { note "- ❌ $1"; fail=1; }

          # 1. apex 가 200 을 주는가 (인증서가 유효해야 curl 이 통과한다)
          code=$(curl -sS "${hdr[@]}" -o /tmp/home.html -w '%{http_code}' --max-time 20 "$APEX/" || echo 000)
          if [ "$code" = "200" ]; then
            ok "apex \`$APEX\` → HTTP 200 (TLS 인증서 유효)"
          else
            bad "apex \`$APEX\` → HTTP $code. DNS 가 아직 Vercel 을 안 가리키거나 인증서 발급 전이다."
          fi

          # 2. www 는 apex 로 넘겨야 한다 (둘 다 200 이면 같은 문서가 두 주소로 색인된다)
          loc=$(curl -sS "${hdr[@]}" -o /dev/null -w '%{redirect_url}' --max-time 20 https://www.gongmoa.kr/ || true)
          case "$loc" in
            "$APEX"/*|"$APEX") ok "www → \`$loc\` 리다이렉트" ;;
            "") bad "www 가 리다이렉트하지 않는다(또는 응답 없음). Vercel Domains 에서 www 를 apex 로 redirect 설정." ;;
            *)  bad "www 가 \`$loc\` 로 간다 — apex 가 아니다." ;;
          esac

          # 3. 홈의 canonical 이 새 도메인을 가리키는가 (여기가 틀리면 색인이 갈린다)
          if grep -qi 'rel="canonical" href="https://gongmoa.kr/"' /tmp/home.html 2>/dev/null; then
            ok "홈 canonical = \`$APEX/\`"
          else
            found=$(grep -oi 'rel="canonical" href="[^"]*"' /tmp/home.html 2>/dev/null | head -1)
            bad "홈 canonical 이 예상과 다르다: \`${found:-없음}\`"
          fi

          # 4. robots.txt 의 Host·Sitemap 줄
          robots=$(curl -sS "${hdr[@]}" --max-time 20 "$APEX/robots.txt" || true)
          if printf '%s' "$robots" | grep -qi "^Host: $APEX"; then
            ok "robots.txt Host 줄 정상"
          else
            bad "robots.txt 의 Host 가 \`$APEX\` 가 아니다."
          fi
          if printf '%s' "$robots" | grep -qi "^Sitemap: $APEX/sitemap.xml"; then
            ok "robots.txt Sitemap 줄 정상"
          else
            bad "robots.txt 에 \`$APEX/sitemap.xml\` 이 없다."
          fi

          # 5. 사이트맵이 열리고 새 도메인 URL 을 담고 있는가
          code=$(curl -sS "${hdr[@]}" -o /tmp/sitemap.xml -w '%{http_code}' --max-time 60 "$APEX/sitemap.xml" || echo 000)
          # grep -c 는 0건일 때 종료코드 1이라 `|| echo 0` 을 붙이면 출력이 두 줄이 된다.
          urls=$(grep -o '<loc>https://gongmoa.kr' /tmp/sitemap.xml 2>/dev/null | wc -l)
          if [ "$code" = "200" ] && [ "$urls" -gt 0 ]; then
            ok "sitemap.xml → HTTP 200, \`gongmoa.kr\` URL $urls 개"
          else
            bad "sitemap.xml → HTTP $code, \`gongmoa.kr\` URL $urls 개"
          fi

          # 6. 애드센스 — 광고를 켠 뒤에만 점검한다(게시자 ID 가 없으면 둘 다 안 붙는다).
          #    둘 중 하나가 조용히 사라지는 것이 실제 위험이다: 로더가 빠지면 심사가
          #    실패하거나 광고가 멈추고, ads.txt 가 빠지면 애드센스가 "수익 손실 위험"
          #    경고를 띄운다. 화면에는 아무 표시가 없어서 밖에서 찔러보는 수밖에 없다.
          adstxt=$(curl -sS "${hdr[@]}" -o /tmp/ads.txt -w '%{http_code}' --max-time 20 "$APEX/ads.txt" || echo 000)
          if grep -qi 'adsbygoogle\.js?client=ca-pub-' /tmp/home.html 2>/dev/null; then
            pub=$(grep -oi 'client=ca-pub-[0-9]*' /tmp/home.html | head -1 | sed 's/client=ca-//')
            ok "애드센스 로더 \`<head>\` 에 있음 (\`$pub\`)"
            # ads.txt 의 번호가 로더의 번호와 같아야 한다 — 다르면 광고는 나오는데
            # 그 도메인의 재고를 팔 권한이 없는 것으로 처리된다.
            if [ "$adstxt" = "200" ] && grep -q "google.com, $pub, DIRECT" /tmp/ads.txt; then
              ok "ads.txt → HTTP 200, 게시자 ID 일치"
            else
              bad "ads.txt → HTTP $adstxt, \`$pub\` 줄을 찾지 못했다: \`$(head -c 120 /tmp/ads.txt | tr '\n' ' ')\`"
            fi
          elif [ "$adstxt" = "200" ]; then
            bad "ads.txt 는 있는데 \`<head>\` 에 애드센스 로더가 없다 — 광고가 멈춘 상태다."
          else
            note "- ⏭️ 애드센스: 게시자 ID 미설정(광고 꺼짐) — 건너뜀"
          fi

          {
            echo "## 도메인 점검 — gongmoa.kr"
            echo ""
            echo "$out"
            echo ""
            if [ "$fail" = "0" ]; then
              echo "전부 통과. Search Console 에 \`$APEX/sitemap.xml\` 제출까지 끝냈는지만 확인하면 된다."
            else
              echo "연결 절차는 루트 \`README.md\` 의 **도메인 — gongmoa.kr** 항목 참고."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$fail"
