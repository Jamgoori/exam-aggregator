# 로컬 Supabase CLI 설정 (`supabase start` / `supabase functions serve` / `supabase db reset`).
#
# `supabase init` 이 만드는 파일을 이 저장소에 맞게 줄인 것이다. 프로덕션 프로젝트 설정과는
# 무관하다 — 대시보드의 Auth/Storage 설정은 여기서 바뀌지 않는다.
# 전체 키 목록: https://supabase.com/docs/guides/local-development/cli/config
# 절차·포트·앱 env 값은 docs/dev-workflow.md.

# `supabase start` 가 컨테이너 이름에 쓰는 접두. 다른 프로젝트와 겹치지 않게.
project_id = "gongmoa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# 프로덕션 프로젝트의 Postgres 메이저 버전과 맞춘다. (불확실: 프로덕션이 15 라면 15 로 —
# `supabase status` 로 뜬 뒤 대시보드 Settings → Infrastructure 값과 비교할 것.)
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
# 이 저장소는 마이그레이션 디렉터리를 쓰지 않는다 — 스키마는 단일 파일 schema.sql 이다.
# schema_paths 는 선언적 스키마(`supabase db diff`) 입력이지 reset 이 적용하는 목록이
# 아니므로 비워 둔다. 적용은 아래 [db.seed] 가 맡는다.
enabled = true
schema_paths = []

[db.seed]
# `supabase db reset`(과 첫 `supabase start`)이 마이그레이션 뒤에 이 순서로 실행한다.
# schema.sql 은 멱등(IF NOT EXISTS / ON CONFLICT)이라 seed 경로로 적용해도 안전하다.
# 순서를 바꾸지 말 것 — seed.sql 픽스처는 schema.sql 의 테이블을 전제한다.
enabled = true
sql_paths = ["./schema.sql", "./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# 로컬 메일 캐처(가입 확인 메일 등). 이메일 확인은 아래 [auth.email] 에서 꺼 두므로
# 보통 볼 일 없다.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  # 앱 딥링크 콜백(프로덕션 대시보드 Redirect URLs 에도 같은 값이 있어야 한다).
  "gongmoa://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
# 로컬 개발 전용. 로컬 Supabase 에는 Google/Kakao/Apple provider 가 없으므로 이메일/비밀번호
# 가입을 여기서만 켠다. 앱 login.tsx 의 이메일 폼은 __DEV__ 에서만 보인다.
# 프로덕션 대시보드의 Email provider 는 켜지 않는다.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

# 소셜 provider 는 로컬에서 켜지 않는다(콘솔 키가 로컬에 없고, 네이티브 SDK 는 프로덕션
# 프로젝트로 콜백한다). 필요하면 [auth.external.google] 등을 env(...) 참조로 추가한다.

[edge_runtime]
enabled = true
# "oneshot" = 파일 변경마다 재시작(개발용). "per_worker" 는 부하 테스트용.
policy = "oneshot"
inspector_port = 8083

# [functions.<name>] 항목은 두지 않는다 — 기본값(verify_jwt = true)으로 충분하고, 함수마다
# 내부에서 requireUser 로 다시 검사한다. 익명 호출이 필요한 함수가 생기면 그때 추가.

[analytics]
# 로그 파이프라인(Logflare·Vector) 컨테이너. 로컬 개발엔 불필요하고 start 만 느려진다.
enabled = false

# Edge Function 은 core 번들(_shared/core.mjs)을 쓰고, 타입 선언(core-types)의
# `@supabase/supabase-js` 베어 지정자는 이 import map 으로 esm.sh 에 매핑한다.
[functions.account-delete]
import_map = "./functions/deno.json"

[functions.avatar-upload]
import_map = "./functions/deno.json"

[functions.board-write]
import_map = "./functions/deno.json"

