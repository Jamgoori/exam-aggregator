[functions.diagnosis-aggregate]
import_map = "./functions/deno.json"

[functions.diagnosis-collect]
import_map = "./functions/deno.json"

[functions.diagnosis-request]
import_map = "./functions/deno.json"

[functions.explanations-get]
import_map = "./functions/deno.json"

[functions.membership-get]
import_map = "./functions/deno.json"

[functions.mix-create]
import_map = "./functions/deno.json"

[functions.notices-write]
